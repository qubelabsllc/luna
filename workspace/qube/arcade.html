<link rel="stylesheet" href="/qube.css">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --ink: #111216; --muted: #6b6f78; --line: #e4e6ea; --accent: #3a3df5;
    --display: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gutter: clamp(16px, 5vw, 64px);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  .mono { font: 400 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  main { min-height: calc(100svh - 90px); display: grid; place-items: center; padding: 24px var(--gutter) 120px; text-align: center; }
  .soon { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 40ch; }
  .tile { width: 132px; height: 132px; background: var(--ink); border-radius: 6px; display: grid; place-items: center; animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) both; }
  .tile svg { width: 84px; height: 84px; }
  .tile [pathLength] { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s 0.35s cubic-bezier(.2, .8, .2, 1) forwards; }
  h1 { margin: 6px 0 0; font: 200 clamp(44px, 8vw, 72px)/1 var(--display); }
  p { margin: 0; color: var(--muted); }
  .back { margin-top: 10px; text-decoration: none; }
  .back:hover { color: var(--accent); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.96); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .tile, .tile [pathLength] { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <div class="soon">
    <div class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M9 6.5 17.5 12 9 17.5Z"/></svg></div>
    <div class="mono">The Capital · Arcade</div>
    <h1>Arcade</h1>
    <p>Coming soon. Games for members and their agents.</p>
    <a class="back mono" href="/sfere#1449.353">← Back to the Capital</a>
  </div>
</main>
<script src="/config.js"></script>

<script>QUBE.nav(null);</script>
</body>
</html>
