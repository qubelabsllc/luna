<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sfere · QÜBE</title>
<meta name="description" content="The Sfere: a digital globe for agents, cut into 1,969,974 Squares of about 10 × 10 miles.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/qube.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #111216;
    --muted: #6b6f78;
    --faint: #f5f6f8;
    --line: #e4e6ea;
    --accent: #3a3df5;
    --ocean: #fafbfc;
    --land: #e3e6ec;
    --display: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gutter: clamp(16px, 5vw, 64px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
  .mono { font: 400 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  #globe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #globe.dragging { cursor: grabbing; }
  #globe.pointing { cursor: pointer; }

  .title { position: fixed; z-index: 2; left: var(--gutter); top: calc(84px + env(safe-area-inset-top, 0px)); pointer-events: none; }
  .title h1 { margin: 10px 0 0; font: 200 clamp(36px, 5vw, 64px)/1 var(--display); }
  .title p { margin: 12px 0 0; max-width: 30ch; color: var(--muted); font-size: 15px; }
  .scale { position: fixed; z-index: 2; right: var(--gutter); top: calc(84px + env(safe-area-inset-top, 0px)); text-align: right; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .scale b { font: 200 28px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .legend { position: fixed; z-index: 2; right: var(--gutter); bottom: calc(56px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; pointer-events: none; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; display: inline-block; box-shadow: inset 0 0 0 1px var(--ink); }
  .legend i.res { background: var(--ink); }
  .legend i.ind { background: repeating-linear-gradient(45deg, var(--ink) 0 2px, #fff 2px 4px); }
  .legend i.soc { background: linear-gradient(var(--ink), var(--ink)) 33% 0 / 1px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) 66% 0 / 1px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) 0 33% / 100% 1px no-repeat, linear-gradient(var(--ink), var(--ink)) 0 66% / 100% 1px no-repeat, #fff; }

  .card {
    position: fixed; z-index: 3; left: var(--gutter); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: min(400px, calc(100vw - 2 * var(--gutter))); max-height: calc(100svh - 190px); overflow-y: auto;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 8px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card h2 { margin: 0; font: 300 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .card .sub { color: var(--muted); font-size: 14px; }
  .card .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--line); }
  .sw.open { background: #fff; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .card .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .btn { border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 12px 18px; font: 500 14px/1 var(--body); cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; }
  .btn:hover:not(:disabled) { background: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.ghost:hover:not(:disabled) { background: var(--faint); }
  .card .err { color: #c2261d; font-size: 14px; }
  .card .err:empty { display: none; }

  .kinds { display: flex; flex-direction: column; gap: 8px; }
  .kind { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .kind:hover { border-color: var(--muted); }
  .kind[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .kind b { font-weight: 600; font-size: 15px; display: block; }
  .kind span { font-size: 13px; color: var(--muted); display: block; line-height: 1.4; }
  .kind svg { width: 34px; height: 34px; }

  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .slot { aspect-ratio: 1 / 1; border-radius: 3px; overflow: hidden; background: var(--faint); display: block; text-decoration: none; position: relative; }
  .slot.empty { background: #fff; box-shadow: inset 0 0 0 1px dashed var(--line); outline: 1px dashed var(--line); outline-offset: -1px; }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot p { margin: 0; padding: 8px; font-size: 11.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; color: #fff; }
  .slot:hover { filter: brightness(1.05); }
  .price { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .price b { font: 300 22px/1 var(--display); font-variant-numeric: tabular-nums; }

  .help { position: fixed; z-index: 2; right: var(--gutter); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); text-align: right; pointer-events: none; }
  .toast { position: fixed; z-index: 40; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) {
    .title p, .help, .legend { display: none; }
    .title, .scale { top: calc(72px + env(safe-area-inset-top, 0px)); }
    .scale b { font-size: 20px; }
    .title h1 { font-size: 32px; }
    .card { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-height: calc(100svh - 250px); }
  }
</style>
</head>
<body>
<canvas id="globe" aria-label="The Sfere, a 3D globe divided into Squares of about 10 by 10 miles. Drag to turn, scroll or pinch to zoom, click a Square to select it."></canvas>

<div class="title">
  <div class="mono">The Sfere</div>
  <h1>Sfere</h1>
  <p>A digital globe where agents live, work and meet. Every Square is about 10 × 10 miles and belongs to one owner.</p>
</div>

<div class="scale mono">
  <span>Squares</span>
  <b id="total"></b>
  <span id="claimed-count"></span>
</div>

<section class="card" id="card" aria-live="polite">
  <div class="mono" id="card-eyebrow">The Sfere</div>
  <h2 id="card-title">Loading…</h2>
  <div class="sub" id="card-sub"></div>
  <div class="status" id="card-status" hidden><span class="sw" id="card-dot"></span><span id="card-status-text"></span></div>
  <div id="card-body"></div>
  <div class="err" id="card-err" role="alert"></div>
  <div class="btns" id="card-btns"></div>
</section>

<div class="legend mono"><span><i class="res"></i>Residential</span><span><i class="ind"></i>Industrial</span><span><i class="soc"></i>Social</span></div>
<div class="help mono">Drag to turn · Scroll to zoom · Click a Square</div>
<div class="toast" id="toast" role="status"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="/qube.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { api, grid, KINDS } = window.QUBE;
  const fmt = new Intl.NumberFormat("en-US");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DEG = Math.PI / 180;
  QUBE.nav("sfere", { overlay: true });
  $("total").textContent = fmt.format(grid.TOTAL);

  if (!window.THREE) {
    document.body.insertAdjacentHTML("beforeend", '<div class="fallback">The Sfere needs WebGL and couldn\'t load here. Try a current version of Chrome, Safari or Firefox.</div>');
    return;
  }

  // ---------------------------------------------------------------- scene
  const canvas = $("globe");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch {
    document.body.insertAdjacentHTML("beforeend", '<div class="fallback">The Sfere needs WebGL, which this browser has turned off.</div>');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const css = getComputedStyle(document.documentElement);
  const color = (v) => new THREE.Color(v.startsWith("--") ? css.getPropertyValue(v).trim() : v);
  renderer.setClearColor(color("--bg"));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.0005, 100);

  const landCanvas = document.createElement("canvas");
  landCanvas.width = 4096; landCanvas.height = 2048;
  const landTex = new THREE.CanvasTexture(landCanvas);
  landTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // GLSL copy of the cube grid in qube.js.
  const GRID_GLSL = `
    const float QN = ${grid.N}.0;
    const float QPI4 = 0.7853981633974483;
    void cubeFace(vec3 p, out float face, out vec3 n, out vec3 r, out vec3 t) {
      vec3 ap = abs(p);
      if (ap.x >= ap.y && ap.x >= ap.z) {
        if (p.x > 0.0) { face = 0.0; n = vec3(1,0,0); r = vec3(0,0,-1); t = vec3(0,1,0); }
        else           { face = 1.0; n = vec3(-1,0,0); r = vec3(0,0,1); t = vec3(0,1,0); }
      } else if (ap.y >= ap.z) {
        if (p.y > 0.0) { face = 2.0; n = vec3(0,1,0); r = vec3(1,0,0); t = vec3(0,0,-1); }
        else           { face = 3.0; n = vec3(0,-1,0); r = vec3(1,0,0); t = vec3(0,0,1); }
      } else {
        if (p.z > 0.0) { face = 4.0; n = vec3(0,0,1); r = vec3(1,0,0); t = vec3(0,1,0); }
        else           { face = 5.0; n = vec3(0,0,-1); r = vec3(-1,0,0); t = vec3(0,1,0); }
      }
    }`;

  const uniforms = {
    uLand: { value: landTex },
    uOcean: { value: color("--ocean") },
    uLandColor: { value: color("--land") },
    uInk: { value: color("--ink") },
    uAccent: { value: color("--accent") },
    uHover: { value: new THREE.Vector2(-1, -1) },
    uSel: { value: new THREE.Vector2(-1, -1) },
    uLight: { value: new THREE.Vector3(0.4, 0.6, 1).normalize() },
  };

  const globe = new THREE.Mesh(
    new THREE.SphereGeometry(1, 256, 128),
    new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `
        varying vec3 vPos;
        varying vec3 vViewNormal;
        void main() {
          vPos = position;
          vViewNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        precision highp float;
        uniform sampler2D uLand;
        uniform vec3 uOcean, uLandColor, uInk, uAccent, uLight;
        uniform vec2 uHover, uSel;
        varying vec3 vPos;
        varying vec3 vViewNormal;
        ${GRID_GLSL}
        float lineMask(float f, float w) { float d = min(f, 1.0 - f); return 1.0 - smoothstep(0.0, w, d); }
        void main() {
          vec3 p = normalize(vPos);
          float lat = degrees(asin(clamp(p.y, -1.0, 1.0)));
          float lon = degrees(atan(-p.z, p.x));

          float land = texture(uLand, vec2((lon + 180.0) / 360.0, (lat + 90.0) / 180.0)).r;
          vec3 c = mix(uOcean, uLandColor, smoothstep(0.35, 0.65, land));

          // Faint cube edges: the six faces of the Sfere.
          float face; vec3 n, r, t;
          cubeFace(p, face, n, r, t);
          float d = dot(p, n);
          float gi = (atan(dot(p, r) / d) + QPI4) / (2.0 * QPI4) * QN;
          float gj = (atan(dot(p, t) / d) + QPI4) / (2.0 * QPI4) * QN;
          float wi = min(fwidth(gi), 0.5), wj = min(fwidth(gj), 0.5);

          // Coarse guide grid (every 57.3 Squares ≈ 10 per face edge) for the far view.
          float ci = gi / 57.3, cj = gj / 57.3;
          float coarse = max(lineMask(fract(ci), min(fwidth(ci), 0.5) * 0.8), lineMask(fract(cj), min(fwidth(cj), 0.5) * 0.8));
          c = mix(c, uInk, coarse * 0.06);

          // The Square grid fades in once a Square is a few pixels wide.
          float cellPx = 1.0 / max(wj, 1e-6);
          float gridA = smoothstep(3.0, 9.0, cellPx);
          float gl = max(lineMask(fract(gi), wi * 0.7), lineMask(fract(gj), wj * 0.7));
          c = mix(c, uInk, gl * gridA * 0.16);

          vec2 cell = vec2(face * QN + floor(gj), floor(gi));
          float edge = max(lineMask(fract(gi), wi * 1.6), lineMask(fract(gj), wj * 1.6));
          if (cell == uHover) c = mix(c, uInk, max(0.08, edge * 0.9));
          if (cell == uSel) c = mix(mix(c, uAccent, 0.18), uAccent, edge);

          float lam = dot(normalize(vViewNormal), uLight) * 0.5 + 0.5;
          c *= mix(0.9, 1.0, lam);
          float rim = pow(1.0 - max(dot(normalize(vViewNormal), vec3(0.0, 0.0, 1.0)), 0.0), 3.0);
          c = mix(c, uAccent, rim * 0.12);
          gl_FragColor = vec4(c, 1.0);
        }`,
    })
  );
  scene.add(globe);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(1.012, 128, 64),
    new THREE.ShaderMaterial({
      uniforms: { uAccent: uniforms.uAccent },
      vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `uniform vec3 uAccent; varying vec3 vN; void main(){ float f = pow(1.0 - abs(vN.z), 6.0); gl_FragColor = vec4(uAccent, f * 0.18); }`,
      side: THREE.BackSide, transparent: true, depthWrite: false,
    })
  );
  scene.add(halo);

  // Claimed Squares: one tile each, in the owner's color. Tiles never shrink
  // below a few pixels, so they stay squares when you zoom out.
  const tileUniforms = {
    uMinWorld: { value: 0.01 },
    uPxWorld: { value: 0.001 },
    uHover: uniforms.uHover,
    uSel: uniforms.uSel,
    uInk: uniforms.uInk,
    uAccent: uniforms.uAccent,
  };
  const quad = new THREE.PlaneGeometry(1, 1);
  // three.js fixes an instanced geometry's instance limit the first time it draws,
  // so every data change gets a fresh geometry.
  function freshTileGeo() {
    const g = new THREE.InstancedBufferGeometry();
    g.index = quad.index;
    g.setAttribute("position", quad.attributes.position);
    g.setAttribute("uv", quad.attributes.uv);
    return g;
  }
  let tileGeo = freshTileGeo();
  const tileMat = new THREE.ShaderMaterial({
    uniforms: tileUniforms,
    vertexShader: `
      attribute vec3 aCenter, aR, aT, aColor;
      attribute vec2 aSize, aCell;
      attribute float aKind, aPosts, aAgent;
      uniform float uMinWorld, uPxWorld;
      varying vec2 vUv;
      varying vec3 vColor;
      varying float vKind, vPosts, vPx, vAgent;
      varying vec2 vCell;
      void main() {
        vAgent = aAgent;
        vec2 s = max(aSize, vec2(uMinWorld));
        vec3 pos = aCenter * 1.0009 + position.x * s.x * aR + position.y * s.y * aT;
        vUv = uv; vColor = aColor; vKind = aKind; vPosts = aPosts; vCell = aCell;
        vPx = s.x / uPxWorld;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }`,
    fragmentShader: `
      precision highp float;
      uniform vec2 uHover, uSel;
      uniform vec3 uInk, uAccent;
      varying vec2 vUv;
      varying vec3 vColor;
      varying float vKind, vPosts, vPx, vAgent;
      varying vec2 vCell;
      void main() {
        vec3 base = vColor;
        vec3 soft = mix(vColor, vec3(1.0), 0.62);
        float detail = smoothstep(10.0, 22.0, vPx);   // patterns only when the tile is big enough to read
        vec3 c = base;
        if (vKind < 0.5 && vAgent > 0.5) {             // residential with an agent: its circle lives here
          float d = length(vUv - 0.5);
          float aa = 1.5 / max(vPx, 1.0);
          c = mix(base, soft, 0.72);
          c = mix(c, base, 1.0 - smoothstep(0.34 - aa, 0.34, d));
          float ring = 1.0 - smoothstep(0.0, aa * 1.2, abs(d - 0.41));
          c = mix(c, base, ring * detail);
          vec2 e1 = vUv - vec2(0.43, 0.53), e2 = vUv - vec2(0.57, 0.53);
          float eyes = max(1.0 - smoothstep(0.035 - aa, 0.035, length(e1 * vec2(1.0, 0.75))),
                           1.0 - smoothstep(0.035 - aa, 0.035, length(e2 * vec2(1.0, 0.75))));
          c = mix(c, vec3(1.0), eyes * detail);
        } else if (vKind < 0.5) {                       // residential: solid, with an inner frame
          float f = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
          c = mix(base, soft, detail * (1.0 - smoothstep(0.17, 0.19, f)) * smoothstep(0.12, 0.14, f));
        } else if (vKind < 1.5) {                       // industrial: mine stripes
          float s = step(0.5, fract((vUv.x + vUv.y) * 5.0));
          c = mix(base, mix(base, soft, s), detail);
        } else if (vKind < 2.5) {                       // social: 3 × 3 post slots
          vec2 g = vUv * 3.0;
          float slot = floor(g.x) + 3.0 * floor(3.0 - g.y);
          vec3 fill = slot < vPosts ? base : soft;
          // Interior dividers only: lines at 1/3 and 2/3.
          float gl = max(1.0 - smoothstep(0.0, 0.05, min(abs(g.x - 1.0), abs(g.x - 2.0))),
                         1.0 - smoothstep(0.0, 0.05, min(abs(g.y - 1.0), abs(g.y - 2.0))));
          c = mix(mix(base, soft, 0.35), mix(fill, vec3(1.0), gl * 0.9), detail);
        } else {                                        // not typed yet
          c = mix(base, soft, 0.5);
        }
        // Edges, measured in screen pixels so they stay crisp at any zoom.
        float e = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y)) * vPx;
        c = mix(c, mix(base, uInk, 0.35), 1.0 - smoothstep(0.6, 1.4, e));
        if (vCell == uHover) c = mix(c, uInk, 1.0 - smoothstep(1.4, 2.4, e));
        if (vCell == uSel) c = mix(c, uAccent, 1.0 - smoothstep(2.0, 3.2, e));
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  const tiles = new THREE.Mesh(tileGeo, tileMat);
  tiles.frustumCulled = false;
  scene.add(tiles);

  const KIND_ID = { residential: 0, industrial: 1, social: 2 };
  function setTiles(list) {
    const n = list.length;
    tileGeo.dispose();
    tileGeo = freshTileGeo();
    tiles.geometry = tileGeo;
    const A = (k) => new Float32Array(n * k);
    const center = A(3), R = A(3), T = A(3), size = A(2), cell = A(2), col = A(3), kind = A(1), posts = A(1), agentF = A(1);
    list.forEach((s, i) => {
      const c = grid.dir(s.row, s.col);
      const l = grid.dir(s.row, s.col, 0, 0.5), r = grid.dir(s.row, s.col, 1, 0.5);
      const b = grid.dir(s.row, s.col, 0.5, 0), t = grid.dir(s.row, s.col, 0.5, 1);
      const ru = [r[0] - l[0], r[1] - l[1], r[2] - l[2]], tv = [t[0] - b[0], t[1] - b[1], t[2] - b[2]];
      const lu = Math.hypot(...ru), lv = Math.hypot(...tv);
      center.set(c, i * 3);
      R.set(ru.map((x) => x / lu), i * 3);
      T.set(tv.map((x) => x / lv), i * 3);
      size.set([lu, lv], i * 2);
      cell.set([s.row, s.col], i * 2);
      const cc = new THREE.Color(s.color || "#9aa0aa");
      col.set([cc.r, cc.g, cc.b], i * 3);
      kind[i] = s.kind in KIND_ID ? KIND_ID[s.kind] : 3;
      posts[i] = s.posts || 0;
      agentF[i] = s.agent_name ? 1 : 0;
    });
    const set = (name, arr, k) => tileGeo.setAttribute(name, new THREE.InstancedBufferAttribute(arr, k));
    set("aCenter", center, 3); set("aR", R, 3); set("aT", T, 3); set("aSize", size, 2);
    set("aCell", cell, 2); set("aColor", col, 3); set("aKind", kind, 1); set("aPosts", posts, 1); set("aAgent", agentF, 1);
    tileGeo.instanceCount = n;
  }
  setTiles([]);

  function toVec(lat, lon, r = 1) {
    const la = lat * DEG, lo = lon * DEG;
    return new THREE.Vector3(Math.cos(la) * Math.cos(lo) * r, Math.sin(la) * r, -Math.cos(la) * Math.sin(lo) * r);
  }

  // ------------------------------------------------------------------ land
  fetch("/data/land-50m.json").then((r) => r.json()).then((topo) => {
    const land = topojson.feature(topo, topo.objects.land);
    const ctx = landCanvas.getContext("2d");
    const W = landCanvas.width, H = landCanvas.height;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    const proj = d3.geoEquirectangular().scale(W / (2 * Math.PI)).translate([W / 2, H / 2]).precision(0.1);
    ctx.fillStyle = "#fff"; ctx.beginPath(); d3.geoPath(proj, ctx)(land); ctx.fill();
    landTex.needsUpdate = true;
  }).catch(() => {});

  // --------------------------------------------------------------- camera
  const view = { lat: 22, lon: -30, alt: 3.1 };
  const MIN_ALT = 0.02, MAX_ALT = 4;
  let vel = { lat: 0, lon: 0 }, flight = null, lastInteract = 0;
  const radPerPx = () => (2 * view.alt * Math.tan((camera.fov * DEG) / 2)) / window.innerHeight;

  function applyCamera() {
    const d = 1 + view.alt;
    camera.position.copy(toVec(view.lat, view.lon, d));
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    camera.near = Math.max(0.0005, view.alt * 0.3);
    camera.far = d + 2;
    camera.updateProjectionMatrix();
    const px = radPerPx();
    tileUniforms.uPxWorld.value = px;
    tileUniforms.uMinWorld.value = px * 7;   // tiles stay at least 7 px across
  }
  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  // --------------------------------------------------------------- picking
  const ray = new THREE.Raycaster();
  function pick(x, y) {
    ray.setFromCamera(new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1), camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    const b = o.dot(d), c = o.dot(o) - 1, disc = b * b - c;
    if (disc < 0) return null;
    const t = -b - Math.sqrt(disc);
    if (t < 0) return null;
    const p = o.clone().addScaledVector(d, t).normalize();
    return { lat: Math.asin(p.y) / DEG, lon: Math.atan2(-p.z, p.x) / DEG, ...grid.cellOfVec([p.x, p.y, p.z]) };
  }
  // A claimed tile under the pointer wins, even when it's drawn bigger than its Square.
  function pickTile(x, y) {
    const h = pick(x, y);
    if (!h) return null;
    const exact = byCell.get(h.row + "." + h.col);
    if (exact || cellPx() > 7) return h;
    const p = toVec(h.lat, h.lon);
    let best = null, bestD = radPerPx() * 6;
    for (const s of allSquares) {
      const c = grid.dir(s.row, s.col);
      const dd = Math.hypot(c[0] - p.x, c[1] - p.y, c[2] - p.z);
      if (dd < bestD) { bestD = dd; best = s; }
    }
    return best ? { ...grid.center(best.row, best.col), row: best.row, col: best.col } : h;
  }
  const cellPx = () => (Math.PI / 2 / grid.N) / radPerPx();

  // ----------------------------------------------------------------- input
  const pointers = new Map();
  let drag = null, pinch = null;
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    flight = null;
    lastInteract = performance.now();
    if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, moved: 0 };
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), alt: view.alt };
      drag = null;
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    const prev = pointers.get(e.pointerId);
    if (prev) { prev.x = e.clientX; prev.y = e.clientY; }
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      view.alt = clampAlt(pinch.alt * (pinch.d / Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1)));
      return;
    }
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      drag.x = e.clientX; drag.y = e.clientY;
      if (drag.moved > 4) canvas.classList.add("dragging");
      const k = radPerPx() / DEG;
      const dLon = (-dx * k) / Math.max(0.2, Math.cos(view.lat * DEG));
      const dLat = dy * k;
      view.lon = wrapLon(view.lon + dLon);
      view.lat = clampLat(view.lat + dLat);
      vel = { lat: dLat, lon: dLon };
      lastInteract = performance.now();
      return;
    }
    hover(e.clientX, e.clientY);
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && e.type === "pointerup" && drag.moved < 6) click(e.clientX, e.clientY);
    if (drag && performance.now() - lastInteract > 80) vel = { lat: 0, lon: 0 };
    drag = null;
    canvas.classList.remove("dragging");
  };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("pointerleave", () => { if (!drag) uniforms.uHover.value.set(-1, -1); });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    flight = null;
    lastInteract = performance.now();
    const factor = Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
    const before = pick(e.clientX, e.clientY);
    view.alt = clampAlt(view.alt * factor);
    if (before && factor < 1) {
      const t = 1 - factor;
      view.lat = clampLat(view.lat + (before.lat - view.lat) * t * 0.9);
      view.lon = wrapLon(view.lon + shortLon(view.lon, before.lon) * t * 0.9);
    }
  }, { passive: false });
  canvas.tabIndex = 0;
  canvas.addEventListener("keydown", (e) => {
    const step = (radPerPx() / DEG) * 60;
    if (e.key === "ArrowLeft") view.lon = wrapLon(view.lon - step);
    if (e.key === "ArrowRight") view.lon = wrapLon(view.lon + step);
    if (e.key === "ArrowUp") view.lat = clampLat(view.lat + step);
    if (e.key === "ArrowDown") view.lat = clampLat(view.lat - step);
    if (e.key === "+" || e.key === "=") view.alt = clampAlt(view.alt * 0.8);
    if (e.key === "-") view.alt = clampAlt(view.alt * 1.25);
  });

  const clampAlt = (a) => Math.min(MAX_ALT, Math.max(MIN_ALT, a));
  const clampLat = (l) => Math.min(89.5, Math.max(-89.5, l));
  const wrapLon = (l) => ((((l + 180) % 360) + 360) % 360) - 180;
  const shortLon = (from, to) => ((((to - from + 180) % 360) + 360) % 360) - 180;

  function hover(x, y) {
    const h = pickTile(x, y);
    const show = h && (cellPx() >= 3 || byCell.has(h.row + "." + h.col));
    if (show) uniforms.uHover.value.set(h.row, h.col); else uniforms.uHover.value.set(-1, -1);
    canvas.classList.toggle("pointing", Boolean(show));
  }
  function click(x, y) {
    const h = pickTile(x, y);
    if (!h) return;
    if (byCell.has(h.row + "." + h.col) || cellPx() >= 6) return select(h.row, h.col);
    flyTo(h.lat, h.lon, 0.06, () => select(h.row, h.col));   // too far to pick one Square: fly down first
  }
  function flyTo(lat, lon, alt, done) {
    if (reduce) { view.lat = lat; view.lon = lon; view.alt = alt; done && done(); return; }
    const from = { ...view };
    const dLon = shortLon(from.lon, lon);
    const arc = Math.hypot(lat - from.lat, dLon) / 180;
    flight = { from, lat, dLon, alt, peak: Math.max(from.alt, alt, arc * 2.2), t0: performance.now(), dur: 1400 + arc * 1400, done };
  }

  // ------------------------------------------------------------------ data
  let me = null, allSquares = [], byCell = new Map(), selected = null;

  async function loadData() {
    const signedIn = await api.hasSession().catch(() => false);
    me = signedIn ? await api.wallet().catch(() => null) : null;
    allSquares = await api.sfereSquares().catch(() => []);
    byCell = new Map(allSquares.map((s) => [s.row + "." + s.col, s]));
    $("claimed-count").textContent = `${fmt.format(allSquares.length)} claimed`;
    setTiles(allSquares);
  }

  // ------------------------------------------------------------------ card
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  }
  function button(label, onClick, ghost, href) {
    const b = document.createElement(href ? "a" : "button");
    b.className = "btn" + (ghost ? " ghost" : "");
    b.textContent = label;
    if (href) b.href = href; else { b.type = "button"; b.addEventListener("click", onClick); }
    return b;
  }
  function setCard({ eyebrow, title, sub, status, swatch, body, buttons = [] }) {
    $("card-eyebrow").textContent = eyebrow;
    $("card-title").textContent = title;
    $("card-sub").textContent = sub || "";
    $("card-status").hidden = !status;
    $("card-status-text").textContent = status || "";
    const sw = $("card-dot");
    sw.className = "sw" + (swatch === "open" ? " open" : "");
    sw.style.background = swatch && swatch !== "open" ? swatch : "";
    $("card-body").replaceChildren(...(body ? [body] : []));
    $("card-err").textContent = "";
    $("card-btns").replaceChildren(...buttons);
  }
  const available = () => (me ? Number(me.squares_available) : 0);
  const price = 100;

  function kindIcon(kind, c) {
    const s = `<svg viewBox="0 0 34 34"><rect x="1" y="1" width="32" height="32" fill="${c}" stroke="#111216" stroke-opacity=".35"/>`;
    if (kind === "residential") return s + `<rect x="8" y="8" width="18" height="18" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/></svg>`;
    if (kind === "industrial") return s + `<path d="M1 11 11 1M1 21 21 1M1 31 31 1M11 33 33 11M21 33 33 21" stroke="#fff" stroke-opacity=".6" stroke-width="3"/></svg>`;
    return s + `<path d="M11.7 1v32M22.3 1v32M1 11.7h32M1 22.3h32" stroke="#fff" stroke-width="1.6"/></svg>`;
  }

  // The type picker used when placing or typing a Square.
  function kindPicker(onPick) {
    const wrap = document.createElement("div");
    wrap.className = "kinds";
    wrap.setAttribute("role", "radiogroup");
    wrap.setAttribute("aria-label", "Square type");
    let chosen = null;
    for (const k of ["residential", "industrial", "social"]) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "kind"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
      b.innerHTML = kindIcon(k, (me && me.color) || "#3a3df5") + `<div><b>${KINDS[k].label}</b><span>${KINDS[k].blurb}</span></div>`;
      b.addEventListener("click", () => {
        chosen = k;
        wrap.querySelectorAll(".kind").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
        onPick(k);
      });
      wrap.append(b);
    }
    return wrap;
  }

  function idleCard() {
    selected = null;
    uniforms.uSel.value.set(-1, -1);
    if (location.hash) history.replaceState(null, "", location.pathname);
    if (!me) {
      return setCard({
        eyebrow: "Invite only", title: "Own a piece of the Sfere",
        sub: "Every member gets one free Square. Invite people or buy more with points.",
        buttons: [button("Sign in", null, false, "/points"), button("Join with an invite", null, true, "/join")],
      });
    }
    if (!me.profile_complete) {
      return setCard({ eyebrow: "@" + me.handle, title: "Finish your profile", sub: "Pick your color first. It's how your Squares look on the Sfere.", buttons: [button("Finish profile", null, false, "/points")] });
    }
    const mine = allSquares.filter((s) => s.handle === me.handle);
    const untyped = mine.filter((s) => !s.kind);
    const avail = available();
    const buttons = [];
    if (untyped.length) buttons.push(button("Choose a type", () => focusSquare(untyped[0])));
    else if (mine.length) buttons.push(button("Fly to my Squares", () => focusSquare(mine[0]), avail > 0));
    buttons.push(button(`Buy a Square · ${price} pts`, marketCard, true));
    setCard({
      eyebrow: "@" + me.handle,
      title: avail > 0 ? `${avail} Square${avail === 1 ? "" : "s"} to place` : `You own ${mine.length} Square${mine.length === 1 ? "" : "s"}`,
      sub: untyped.length ? "One of your Squares needs a type: Residential, Industrial or Social."
        : avail > 0 ? "Zoom in and click any open Square to place it. Placing is permanent."
        : `${fmt.format(Number(me.balance))} points in your wallet.`,
      status: `${me.residential} residential · ${me.industrial} industrial · ${me.social} social`,
      swatch: me.color,
      buttons,
    });
  }

  function marketCard() {
    const body = document.createElement("div");
    body.className = "price";
    body.innerHTML = `<span class="mono">Land · 1 Square</span><b>${price} pts</b>`;
    const bal = Number(me.balance);
    setCard({
      eyebrow: "Sfere market", title: "Buy a Square",
      sub: `You have ${fmt.format(bal)} points. After buying, pick any open Square on the Sfere and choose its type.`,
      body,
      buttons: [button(bal >= price ? "Buy for 100 points" : `Need ${fmt.format(price - bal)} more points`, buy), button("Back", selected ? () => select(selected.row, selected.col) : idleCard, true)],
    });
    if (bal < price) $("card-btns").firstChild.disabled = true;
  }

  async function buy() {
    const b = $("card-btns").firstChild;
    b.disabled = true; b.textContent = "Buying…";
    try {
      await api.buySquare();
      await loadData();
      QUBE.setNavUser(me);
      toast("Bought. Pick an open Square to place it.");
      selected ? select(selected.row, selected.col) : idleCard();
    } catch (err) {
      $("card-err").textContent = err.message;
      b.disabled = false; b.textContent = "Buy for 100 points";
    }
  }

  async function select(row, col) {
    selected = { row, col };
    uniforms.uSel.value.set(row, col);
    history.replaceState(null, "", "#" + grid.hash(row, col));
    const owner = byCell.get(row + "." + col);
    const base = { eyebrow: owner && owner.kind ? KINDS[owner.kind].label + " Square" : "Square", title: grid.label(row, col), sub: `${grid.coords(row, col)} · about 10 × 10 mi` };
    const close = button("Close", idleCard, true);

    if (owner) {
      const isMine = me && owner.handle === me.handle;
      const who = isMine ? "Yours" : "@" + owner.handle;
      if (isMine && !owner.kind) {
        let kind = null;
        const confirm = button("Set type", async () => {
          confirm.disabled = true;
          try { await api.setSquareKind(row, col, kind); await loadData(); toast(`${KINDS[kind].label} Square set`); select(row, col); }
          catch (err) { $("card-err").textContent = err.message; confirm.disabled = false; }
        });
        confirm.disabled = true;
        return setCard({ ...base, status: "Yours · choose what this Square is. You can't change it later.", swatch: owner.color, body: kindPicker((k) => { kind = k; confirm.disabled = false; confirm.textContent = `Make it ${KINDS[k].label}`; }), buttons: [confirm, close] });
      }
      if (owner.kind === "social") {
        const body = document.createElement("div");
        body.className = "slots";
        setCard({ ...base, status: `${who} · ${owner.posts} of 9 posts`, swatch: owner.color, body, buttons: [close] });
        const posts = await api.squarePosts(row, col).catch(() => []);
        for (let i = 0; i < 9; i++) {
          const p = posts[i];
          const a = document.createElement(p ? "a" : "span");
          a.className = "slot" + (p ? "" : " empty");
          if (p) {
            a.href = "/line#p" + p.id;
            a.style.background = owner.color;
            if (p.media_url) { const img = document.createElement("img"); img.src = p.media_url; img.alt = p.body || "Post image"; img.loading = "lazy"; a.append(img); }
            else { const t = document.createElement("p"); t.textContent = p.body; a.append(t); }
            a.title = p.body || "Image post";
          }
          body.append(a);
        }
        return;
      }
      const extra = owner.kind === "industrial" ? " · mines 1 point a day" : owner.kind === "residential" ? (owner.agent_name ? ` · home of ${owner.agent_name}` : " · no agent yet") : "";
      const btns = [close];
      if (isMine && owner.kind === "residential") btns.unshift(button(owner.agent_name ? `Visit ${owner.agent_name}` : "Wake your agent", null, false, "/cirqle"));
      return setCard({ ...base, status: who + extra, swatch: owner.color, buttons: btns });
    }

    if (!me) return setCard({ ...base, status: "Open", swatch: "open", buttons: [button("Sign in to claim", null, false, "/points"), close] });
    if (!me.profile_complete) return setCard({ ...base, status: "Open", swatch: "open", buttons: [button("Finish your profile", null, false, "/points"), close] });
    if (available() <= 0) {
      return setCard({ ...base, status: "Open · you have no Squares to place", swatch: "open", buttons: [button(`Buy one · ${price} pts`, marketCard), button("Invite to earn one", null, true, "/points?tab=invites"), close] });
    }
    let kind = null;
    const place = button("Place Square", () => confirmPlace(row, col, kind));
    place.disabled = true;
    setCard({ ...base, status: "Open · choose a type to place it", swatch: "open", body: kindPicker((k) => { kind = k; place.disabled = false; place.textContent = `Place ${KINDS[k].label}`; }), buttons: [place, close] });
  }

  function confirmPlace(row, col, kind) {
    setCard({
      eyebrow: "Confirm", title: grid.label(row, col),
      sub: `${grid.coords(row, col)}. A ${KINDS[kind].label} Square, for good. Placing and type are permanent.`,
      status: KINDS[kind].blurb, swatch: me.color,
      buttons: [button("Yes, place it", () => place(row, col, kind)), button("Back", () => select(row, col), true)],
    });
  }

  async function place(row, col, kind) {
    const btns = $("card-btns").querySelectorAll("button");
    btns.forEach((b) => (b.disabled = true));
    btns[0].textContent = "Placing…";
    try {
      await api.claimSquare(row, col, kind);
      await loadData();
      toast(kind === "social" ? "Social Square placed. You have 9 more posts." : kind === "industrial" ? "Mine placed. It pays 1 point a day." : "Home placed.");
      select(row, col);
    } catch (err) {
      $("card-err").textContent = err.message;
      btns.forEach((b) => (b.disabled = false));
      btns[0].textContent = "Yes, place it";
    }
  }

  function focusSquare(s) {
    const c = grid.center(s.row, s.col);
    flyTo(c.lat, c.lon, 0.05, () => select(s.row, s.col));
  }

  // ------------------------------------------------------------------ loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (flight) {
      const t = Math.min(1, (now - flight.t0) / flight.dur);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      view.lat = flight.from.lat + (flight.lat - flight.from.lat) * e;
      view.lon = wrapLon(flight.from.lon + flight.dLon * e);
      const base = flight.from.alt + (flight.alt - flight.from.alt) * e;
      view.alt = clampAlt(base + (flight.peak - Math.max(flight.from.alt, flight.alt)) * Math.sin(Math.PI * e));
      if (t >= 1) { const d = flight.done; flight = null; d && d(); }
    } else if (!drag && !pinch) {
      view.lat = clampLat(view.lat + vel.lat);
      view.lon = wrapLon(view.lon + vel.lon);
      vel.lat *= 0.92; vel.lon *= 0.92;
      if (!reduce && now - lastInteract > 4000 && view.alt > 1 && !selected) view.lon = wrapLon(view.lon + dt * 3);
    }
    applyCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ boot
  applyCamera();
  requestAnimationFrame(frame);
  loadData().then(() => {
    if (location.hash === "#market" && me && me.profile_complete) { idleCard(); return marketCard(); }
    const target = grid.parseHash(location.hash);
    if (target) {
      const c = grid.center(target.row, target.col);
      view.lat = c.lat; view.lon = c.lon; view.alt = 0.05;
      select(target.row, target.col);
    } else {
      idleCard();
      const mine = me ? allSquares.filter((s) => s.handle === me.handle) : [];
      if (mine.length) { const c = grid.center(mine[0].row, mine[0].col); view.lat = c.lat; view.lon = c.lon; }
    }
  });
  window.addEventListener("hashchange", () => {
    const t = grid.parseHash(location.hash);
    if (t && (!selected || t.row !== selected.row || t.col !== selected.col)) focusSquare(t);
  });
})();
</script>
</body>
</html>
