<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space · QÜBE</title>
<meta name="description" content="A Space on the Sfere: the place inside a QÜBE Square, built by its owner and their agent.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/qube.css">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --ink: #111216; --muted: #6b6f78; --faint: #f5f6f8; --line: #e4e6ea; --accent: #3a3df5; --berry: #e33a6d;
    --display: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gutter: clamp(16px, 4vw, 48px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--faint); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  .mono { font: 400 11px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #world.dragging { cursor: grabbing; }
  #world.pointing { cursor: pointer; }
  #world.placing { cursor: crosshair; }
  body.night .ui { --panel: rgba(24, 25, 44, 0.86); --panel-ink: #f2f2fa; --panel-muted: #a3a6c2; --panel-line: rgba(255, 255, 255, 0.12); }
  .ui { --panel: rgba(255, 255, 255, 0.9); --panel-ink: var(--ink); --panel-muted: var(--muted); --panel-line: var(--line); }

  .head { position: fixed; z-index: 2; left: var(--gutter); top: calc(84px + env(safe-area-inset-top, 0px)); max-width: min(420px, 60vw); pointer-events: none; color: var(--panel-ink); }
  .head .mono { color: var(--panel-muted); }
  .head h1 { margin: 8px 0 0; font: 200 clamp(28px, 4vw, 46px)/1.05 var(--display); overflow-wrap: anywhere; }
  .head p { margin: 8px 0 0; color: var(--panel-muted); font-size: 14px; }
  .head a { pointer-events: auto; text-decoration: none; }
  .head a:hover { color: var(--accent); }

  .rooms { position: fixed; z-index: 3; right: var(--gutter); top: calc(84px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 46vw; }
  .rooms button { border: 0; cursor: pointer; padding: 7px 12px; border-radius: 999px; background: var(--panel); color: var(--panel-ink); box-shadow: inset 0 0 0 1px var(--panel-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 400 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .rooms button[aria-current="true"] { background: var(--ink); color: #fff; box-shadow: none; }
  body.night .rooms button[aria-current="true"] { background: #fff; color: var(--ink); }
  .rooms button.add { color: var(--accent); }

  .tools { position: fixed; z-index: 3; right: var(--gutter); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
  .iconbtn { width: 42px; height: 42px; border-radius: 999px; border: 0; cursor: pointer; background: var(--panel); color: var(--panel-ink); box-shadow: inset 0 0 0 1px var(--panel-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; font-size: 17px; }
  .iconbtn:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  .pill { height: 42px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer; background: var(--ink); color: #fff; font: 500 14px/1 var(--body); }
  .pill:hover:not(:disabled) { background: var(--accent); }
  .pill:disabled { opacity: 0.4; cursor: default; }
  .pill.ghost { background: var(--panel); color: var(--panel-ink); box-shadow: inset 0 0 0 1px var(--panel-line); backdrop-filter: blur(10px); }
  .pill.sure { background: var(--accent); }

  .card { position: fixed; z-index: 4; left: var(--gutter); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 2 * var(--gutter))); max-height: calc(100svh - 220px); overflow-y: auto; background: var(--panel); color: var(--panel-ink); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--panel-line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font: 300 21px/1.15 var(--display); overflow-wrap: anywhere; }
  .card .sub { color: var(--panel-muted); font-size: 14px; }
  .card .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .err { color: #e5484d; font-size: 14px; }
  .card .err:empty { display: none; }
  .card img.full { width: 100%; border-radius: 6px; display: block; }
  .card textarea, .card input[type=text], .card input[type=number] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--panel-line); background: transparent; color: var(--panel-ink); resize: vertical; }
  .gb { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
  .gb li { font-size: 14px; }
  .gb b { font-weight: 600; }
  .gb .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .posts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .posts a { display: block; padding: 10px 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--panel-line); text-decoration: none; font-size: 14px; }

  /* the builder */
  .build { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; padding: 10px var(--gutter) calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--panel); color: var(--panel-ink); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--panel-line); display: flex; flex-direction: column; gap: 10px; }
  .build-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .build-top input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--panel-line); background: transparent; color: var(--panel-ink); width: 160px; }
  .build-top .grow { flex: 1; }
  .build-top .saved { font: 400 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--panel-muted); }
  .seg { display: inline-flex; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--panel-line); padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; cursor: pointer; padding: 7px 12px; border-radius: 999px; font: 400 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--panel-muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  body.night .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .palette { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .palette .cat { font: 400 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--panel-muted); writing-mode: vertical-rl; transform: rotate(180deg); padding: 4px 2px; flex: none; }
  .item { flex: none; width: 74px; border: 0; cursor: pointer; background: transparent; border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: inset 0 0 0 1px var(--panel-line); color: var(--panel-ink); }
  .item:hover { box-shadow: inset 0 0 0 1px var(--panel-muted); }
  .item[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  .item canvas { width: 48px; height: 44px; }
  .item b { font: 500 12px/1 var(--body); }
  .item small { font: 400 10px/1 var(--mono); color: var(--panel-muted); }
  .swatches { display: flex; gap: 5px; flex-wrap: wrap; }
  .swatches button { width: 22px; height: 22px; border-radius: 6px; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .toast { position: fixed; z-index: 40; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .empty-note { position: fixed; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--panel-muted); pointer-events: none; }

  body.building .card { bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
  body.building .tools { bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
  @media (max-width: 760px) {
    .head { top: calc(70px + env(safe-area-inset-top, 0px)); max-width: 62vw; }
    .head p { display: none; }
    .rooms { top: calc(70px + env(safe-area-inset-top, 0px)); }
    .tools { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
    .card { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); max-height: 46svh; }
    body.building .card { bottom: calc(230px + env(safe-area-inset-bottom, 0px)); }
    body.building .tools { bottom: calc(230px + env(safe-area-inset-bottom, 0px)); }
    .build { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    .build-top input { width: 120px; }
  }
</style>
</head>
<body>
<canvas id="world" aria-label="A Space: an isometric room built on a Square of the Sfere. Drag to look around, click things to use them."></canvas>

<div class="ui">
  <div class="head">
    <div class="mono" id="eyebrow">Space</div>
    <h1 id="title">Loading…</h1>
    <p id="sub"></p>
  </div>
  <nav class="rooms" id="rooms" aria-label="Rooms"></nav>
  <div class="empty-note mono" id="empty" hidden></div>

  <div class="tools">
    <button class="iconbtn" id="rot-l" type="button" aria-label="Turn left" title="Turn left">↺</button>
    <button class="iconbtn" id="rot-r" type="button" aria-label="Turn right" title="Turn right">↻</button>
    <button class="iconbtn" id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button class="iconbtn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button class="pill" id="build-btn" type="button" hidden>Build</button>
  </div>

  <section class="card" id="card" hidden aria-live="polite">
    <div class="mono" id="card-eyebrow"></div>
    <h2 id="card-title"></h2>
    <div class="sub" id="card-sub"></div>
    <div id="card-body"></div>
    <div class="err" id="card-err" role="alert"></div>
    <div class="btns" id="card-btns"></div>
  </section>

  <section class="build" id="build" hidden aria-label="Build">
    <div class="build-top">
      <div class="seg" role="group" aria-label="Tool">
        <button type="button" id="tool-place" aria-pressed="true">Place</button>
        <button type="button" id="tool-select" aria-pressed="false">Select</button>
        <button type="button" id="tool-erase" aria-pressed="false">Erase</button>
      </div>
      <div class="swatches" id="swatches" aria-label="Color"></div>
      <button class="iconbtn" id="undo" type="button" aria-label="Undo" title="Undo">⤺</button>
      <span class="grow"></span>
      <input id="space-title" maxlength="48" placeholder="Name your Space" aria-label="Space name">
      <span class="saved" id="saved"></span>
      <button class="pill" id="publish" type="button" disabled>Publish</button>
      <button class="pill ghost" id="done" type="button">Done</button>
    </div>
    <div class="palette" id="palette" aria-label="Blocks"></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="/qube.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { api, grid, KINDS } = window.QUBE;
  QUBE.nav("sfere", { overlay: true });
  const fmt = new Intl.NumberFormat("en-US");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ----------------------------------------------------------------- address
  // /sfere/5-083-553 or /sfere/5-083-553/room
  const parts = location.pathname.replace(/^\/+|\/+$/g, "").split("/");
  const at = grid.parseAddr(parts[1] || "") || grid.parseAddr(location.hash);
  const startRoom = parts[2] || "main";
  if (!at) { $("title").textContent = "No such Square"; return; }
  const { row, col } = at;
  const addr = grid.addr(row, col);
  const LON = grid.center(row, col).lon;

  // ------------------------------------------------------------------ blocks
  // Each block: what it's called, what it costs, where it goes, and how it draws.
  const BLOCKS = {
    brick:     { cat: "Build",   name: "Brick",       cost: 1,  stack: true,  colored: true },
    shape:     { cat: "Build",   name: "Shape",       cost: 5,  stack: true,  colored: true },
    paint:     { cat: "Build",   name: "Paint",       cost: 1,  floor: true,  colored: true },
    water:     { cat: "Build",   name: "Water",       cost: 2,  floor: true },
    light:     { cat: "Build",   name: "Lamp",        cost: 5,  colored: true },
    plant:     { cat: "Build",   name: "Plant",       cost: 3 },
    berrybush: { cat: "Build",   name: "Berry bush",  cost: 3 },
    sign:      { cat: "Show",    name: "Neon sign",   cost: 10, colored: true },
    frame:     { cat: "Show",    name: "Frame",       cost: 10 },
    board:     { cat: "Show",    name: "Notice board", cost: 15 },
    portal:    { cat: "Connect", name: "Portal",      cost: 25 },
    guestbook: { cat: "Connect", name: "Guestbook",   cost: 10 },
    tipjar:    { cat: "Trade",   name: "Tip jar",     cost: 10 },
  };
  const SHAPES = ["sphere", "pyramid", "cylinder", "penta", "hexa"];
  const PLANTS = ["bush", "tree", "flowers"];
  const PALETTE = ["#111216", "#ffffff", "#c9cdd6", "#3a3df5", "#7b7ef8", "#e33a6d", "#ff8a3d", "#ffd23d", "#3ddc84", "#1fb5a8", "#5bc0ff", "#9b5cff", "#8a5a3c"];

  // ------------------------------------------------------------------ state
  let space = null, roomIdx = 0, layout = { v: 1, blocks: [] };
  let rot = 0, zoom = 1, pan = { x: 0, y: 0 }, intro = 0;
  let building = false, tool = "place", pick = "brick", color = null, selectedId = null;
  const undoStack = [];
  const room = () => (space && space.rooms[roomIdx]) || null;
  const uid = () => Math.random().toString(36).slice(2, 9);

  // ---------------------------------------------------------------- canvas
  const cv = $("world");
  let ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }
  addEventListener("resize", resize); resize();

  // Geometry: cells are 1 × 1, z is in block heights. The view turns in quarter steps.
  const TW = () => Math.min(W, (H - (building ? 190 : 0)) * 1.4) / 11 * zoom * (0.6 + 0.4 * intro);
  const BH = () => TW() * 0.56;
  function turn(x, y) {   // a point on the floor, turned by the view (cell centers stay centers)
    let X = x - 4.5, Y = y - 4.5;
    for (let i = 0; i < rot; i++) { const t = X; X = -Y; Y = t; }
    return [X, Y];
  }
  function unturn(X, Y) {
    for (let i = 0; i < rot; i++) { const t = X; X = Y; Y = -t; }
    return [X + 4.5, Y + 4.5];
  }
  const CX = () => W / 2 + pan.x, CY = () => (building ? (H - 190) * 0.58 : H * 0.56) + pan.y;
  function P(X, Y, z) {   // turned coordinates → screen
    const tw = TW();
    return [CX() + (X - Y) * tw / 2, CY() + (X + Y) * tw / 4 - z * BH()];
  }
  const Pc = (x, y, z) => { const [X, Y] = turn(x, y); return P(X, Y, z); };   // cell coords → screen

  // ------------------------------------------------------------------ color
  function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function shade(h, k) {   // k > 0 lightens, k < 0 darkens
    const [r, g, b] = hex2rgb(h);
    const f = (c) => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  const rgba = (h, a) => { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };
  const mixHex = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };

  // -------------------------------------------------------------- day/night
  // Night where the Square is: the sun follows its longitude.
  function nightness() {
    const now = new Date();
    const hour = (now.getUTCHours() + now.getUTCMinutes() / 60 + LON / 15 + 48) % 24;
    if (hour >= 7.5 && hour <= 17.5) return 0;
    if (hour >= 20 || hour <= 5) return 1;
    return hour < 12 ? (7.5 - hour) / 2.5 : (hour - 17.5) / 2.5;
  }
  let night = 0;

  // ---------------------------------------------------------------- drawing helpers
  function poly(pts, fill, stroke) {
    ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }
  // A prism standing on (X, Y): n sides, radius r (in cells), from z0 to z1. n = 4 at 45° is a cube.
  function prism(X, Y, n, r, a0, z0, z1, c, opts = {}) {
    const pts = Array.from({ length: n }, (_, i) => { const a = a0 + (i / n) * Math.PI * 2; return [X + Math.cos(a) * r, Y + Math.sin(a) * r]; });
    const edge = opts.edge ?? "rgba(17,18,22,0.14)";
    const sides = [];
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const nx = (a[1] - b[1]), ny = (b[0] - a[0]);   // outward normal (counter-clockwise polygon)
      if (nx + ny <= 0) continue;   // faces away from the viewer (who looks along −X −Y)
      sides.push({ a, b, d: (a[0] + b[0] + a[1] + b[1]) / 2, light: nx / Math.hypot(nx, ny) });
    }
    sides.sort((p, q) => p.d - q.d);
    for (const s of sides) {
      const k = -0.05 - 0.22 * Math.max(0, s.light) + (opts.glass ? 0 : 0);
      poly([P(s.a[0], s.a[1], z1), P(s.b[0], s.b[1], z1), P(s.b[0], s.b[1], z0), P(s.a[0], s.a[1], z0)], opts.alpha ? rgba(c, opts.alpha) : shade(c, k), edge);
    }
    const top = pts.map(([x, y]) => P(x, y, z1));
    if (!opts.noTop) poly(top, opts.alpha ? rgba(c, opts.alpha * 0.8) : shade(c, 0.14), edge);
    return top;
  }
  const cube = (X, Y, z0, z1, c, o) => prism(X, Y, 4, Math.SQRT1_2 * 0.999, Math.PI / 4, z0, z1, c, o);
  function shadowAt(X, Y, z, r) {
    const [sx, sy] = P(X, Y, z); const tw = TW();
    ctx.fillStyle = `rgba(17,18,22,${0.12 * (1 - night * 0.5)})`;
    ctx.beginPath(); ctx.ellipse(sx, sy, r * tw / 2, r * tw / 4, 0, 0, 7); ctx.fill();
  }
  function ball(X, Y, zc, r, c) {
    const [sx, sy] = P(X, Y, zc); const R = r * TW() * 0.62;
    const g = ctx.createRadialGradient(sx - R * 0.35, sy - R * 0.4, R * 0.1, sx, sy, R);
    g.addColorStop(0, shade(c, 0.45)); g.addColorStop(0.65, c); g.addColorStop(1, shade(c, -0.3));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 7); ctx.fill();
    return [sx, sy, R];
  }
  // A flat panel standing upright along one axis of the floor (d = 0 along x, 1 along y).
  function panelCorners(x, y, z0, z1, d, half = 0.44) {
    const a = d ? [x + 0.5, y + 0.5 - half] : [x + 0.5 - half, y + 0.5];
    const b = d ? [x + 0.5, y + 0.5 + half] : [x + 0.5 + half, y + 0.5];
    const A = turn(a[0] - 0.5 + 0.5, a[1] - 0.5 + 0.5), B = turn(b[0], b[1]);
    return [P(A[0], A[1], z1), P(B[0], B[1], z1), P(B[0], B[1], z0), P(A[0], A[1], z0)];
  }
  const images = new Map();
  function img(url) {
    if (!url) return null;
    if (!images.has(url)) { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => (dirty = true); im.src = url; images.set(url, im); }
    const im = images.get(url);
    return im.complete && im.naturalWidth ? im : null;
  }
  function drawOnPanel(corners, im) {   // affine-map an image onto a standing panel
    const [A, B, , D] = corners;
    const s = Math.min(im.naturalWidth, im.naturalHeight), sx0 = (im.naturalWidth - s) / 2, sy0 = (im.naturalHeight - s) / 2;
    ctx.save();
    ctx.setTransform(DPR * (B[0] - A[0]) / s, DPR * (B[1] - A[1]) / s, DPR * (D[0] - A[0]) / s, DPR * (D[1] - A[1]) / s, DPR * A[0], DPR * A[1]);
    ctx.drawImage(im, sx0, sy0, s, s, 0, 0, s, s);
    ctx.restore();
  }

  // ---------------------------------------------------------------- what's in the room
  // Built-in pieces from the Square's type sit in the back corner (cells 0–2, 0–2).

    $("saved").textContent = "Unsaved";
    clearTimeout(saveT);
    saveT = setTimeout(save, soft ? 1400 : 900);
  }
  function cleanLayout() {   // drop editor-only fields before saving
    return { v: 1, blocks: layout.blocks.map(({ id, ...b }) => b) };
  }
  async function save() {
    if (saving) { clearTimeout(saveT); saveT = setTimeout(save, 500); return; }
    saving = true;
    const r = room();
    try {
      await api.spaceSaveDraft(row, col, r.slug, r.name, cleanLayout());
      r.draft = cleanLayout();
      $("saved").textContent = "Draft saved";
      await refreshCost();
    } catch (err) { $("saved").textContent = "Not saved"; toast(err.message); }
    saving = false;
  }
  async function refreshCost() {
    const r = room();
    const same = JSON.stringify(r.published || null) === JSON.stringify(r.draft || null);
    let cost = 0;
    try { cost = Number(await api.spacePublishCost(row, col, r.slug)) || 0; } catch {}
    const b = $("publish");
    b.disabled = same; b.classList.remove("sure");
    b.textContent = same ? "Published" : cost > 0 ? `Publish · ${fmt.format(cost)} pts` : "Publish · free";
    b.dataset.cost = cost;
  }
  let armed = false;
  $("publish").addEventListener("click", async () => {
    const b = $("publish"), cost = Number(b.dataset.cost || 0);
    if (cost > 0 && !armed) { armed = true; b.classList.add("sure"); b.textContent = `Confirm · ${fmt.format(cost)} pts`; setTimeout(() => { if (armed) { armed = false; refreshCost(); } }, 4000); return; }
    armed = false; b.disabled = true; b.textContent = "Publishing…";
    clearTimeout(saveT); await save();
    try {
      await api.spacePublish(row, col, room().slug);
      await reload(true);
      toast(cost > 0 ? `Published. ${fmt.format(cost)} points went to the Central Bank.` : "Published.");
    } catch (err) { toast(err.message); refreshCost(); }
  });

  // ---------------------------------------------------------------- the builder UI
  function thumb(type) {
    const c = document.createElement("canvas"); c.width = 96; c.height = 88;
    const save = { W, H, DPR, rot, zoom, pan: { ...pan }, intro, building };
    return { c, draw() {
      const g = c.getContext("2d");
      const real = ctx;
      try {
        W = 48; H = 44; DPR = 2; building = false; rot = 0; zoom = 8; pan = { x: 0, y: 8 }; intro = 1;
        ctxSwap(g);
        g.clearRect(0, 0, 96, 88); g.setTransform(2, 0, 0, 2, 0, 0);
        const b = { t: type, x: 4, y: 4, z: 0, c: color || space.color, s: lastShape, k: lastPlant, text: "Hi", at: Date.now() - 3 * 86400000, label: "" };
        if (type === "paint" || type === "water") {
          const [X, Y] = turn(4.5, 4.5);
          const quad = [P(X - 0.5, Y - 0.5, 0), P(X + 0.5, Y - 0.5, 0), P(X + 0.5, Y + 0.5, 0), P(X - 0.5, Y + 0.5, 0)];
          poly(quad, type === "water" ? "#5bc0ff" : b.c, "rgba(17,18,22,.2)");
        } else drawBlock(b, performance.now());
      } finally {
        ctxSwap(real); W = save.W; H = save.H; DPR = save.DPR; rot = save.rot; zoom = save.zoom; pan = save.pan; intro = save.intro; building = save.building;
      }
    } };
  }
  const ctxSwap = (g) => { ctx = g; };   // thumbnails borrow the renderer
  function buildPalette() {
    const pal = $("palette"); pal.replaceChildren();
    let cat = null;
    for (const [type, def] of Object.entries(BLOCKS)) {
      if (def.cat !== cat) { cat = def.cat; const s = document.createElement("span"); s.className = "cat"; s.textContent = cat; pal.append(s); }
      const b = document.createElement("button"); b.type = "button"; b.className = "item";
      b.setAttribute("aria-pressed", String(pick === type && tool === "place"));
      const th = thumb(type);
      b.append(th.c);
      const name = document.createElement("b"); name.textContent = def.name;
      const cost = document.createElement("small"); cost.textContent = `${def.cost} pt${def.cost === 1 ? "" : "s"}`;
      b.append(name, cost);
      b.addEventListener("click", () => { pick = type; setTool("place"); });
      pal.append(b);
      th.draw();
    }
  }
  function buildSwatches() {
    const sw = $("swatches"); sw.replaceChildren();
    for (const c of [space.color, ...PALETTE.slice(0, 9)]) {
      const s = document.createElement("button"); s.type = "button"; s.style.background = c; s.setAttribute("aria-label", "Color " + c);
      s.setAttribute("aria-pressed", String(c === color));
      s.addEventListener("click", () => { color = c; buildSwatches(); buildPalette(); });
      sw.append(s);
    }
  }
  function setTool(t) {
    tool = t;
    for (const k of ["place", "select", "erase"]) $("tool-" + k).setAttribute("aria-pressed", String(k === t));
    if (t !== "select") { selectedId = null; }
    buildPalette();
  }
  $("tool-place").addEventListener("click", () => setTool("place"));
  $("tool-select").addEventListener("click", () => setTool("select"));
  $("tool-erase").addEventListener("click", () => setTool("erase"));
  $("undo").addEventListener("click", undo);

  function enterBuild(on) {
    building = on;
    document.body.classList.toggle("building", on);
    $("build").hidden = !on;
    $("build-btn").hidden = on || !space.is_owner;
    closeCard(); selectedId = null; hoverCell = null;
    const r = room();
    layout = { v: 1, blocks: JSON.parse(JSON.stringify(((on ? r.draft : r.published) || { blocks: [] }).blocks || [])).map((b) => ({ id: uid(), ...b })) };
    undoStack.length = 0;
    if (on) {
      color = color || space.color;
      $("space-title").value = space.title || "";
      $("saved").textContent = "Draft";
      buildSwatches(); buildPalette(); refreshCost();
    }
    renderRooms(); showEmpty();
  }
  $("build-btn").addEventListener("click", () => enterBuild(true));
  $("done").addEventListener("click", async () => { clearTimeout(saveT); if ($("saved").textContent === "Unsaved") await save(); enterBuild(false); });
  $("space-title").addEventListener("change", async () => {
    try { await api.spaceSetTitle(row, col, $("space-title").value); space.title = $("space-title").value.trim() || null; header(); toast("Named."); } catch (err) { toast(err.message); }
  });

  // ---------------------------------------------------------------- rooms
  function renderRooms() {
    const nav = $("rooms"); nav.replaceChildren();
    const list = space.rooms.filter((r) => building || space.is_owner || r.published);
    if (list.length > 1 || building) list.forEach((r) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = r.name + (space.is_owner && !r.published ? " · draft" : "");
      b.setAttribute("aria-current", String(r === room()));
      b.addEventListener("click", () => { roomIdx = space.rooms.indexOf(r); history.replaceState(null, "", `/sfere/${addr}${r.slug === "main" ? "" : "/" + r.slug}`); enterBuild(building); });
      nav.append(b);
    });
    if (building) {
      if (space.rooms.length < 9) {
        const add = document.createElement("button"); add.type = "button"; add.className = "add"; add.textContent = "+ Room";
        add.addEventListener("click", async () => {
          const name = (prompt("Name the new room", "Room " + (space.rooms.length + 1)) || "").trim();
          if (!name) return;
          let slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "room";
          while (space.rooms.some((r) => r.slug === slug)) slug = (slug.slice(0, 20) + "-" + Math.floor(Math.random() * 90 + 10));
          try {
            await api.spaceSaveDraft(row, col, slug, name, { v: 1, blocks: [] });
            space.rooms.push({ slug, name, draft: { v: 1, blocks: [] }, published: null });
            roomIdx = space.rooms.length - 1;
            enterBuild(true);
            toast(`${name} added. Publishing a new room costs 50 points.`);
          } catch (err) { toast(err.message); }
        });
        nav.append(add);
      }
      if (room() && room().slug !== "main") {
        const del = document.createElement("button"); del.type = "button"; del.textContent = "Delete room";
        del.addEventListener("click", async () => {
          if (!confirm(`Delete ${room().name}? Its blocks are gone for good.`)) return;
          try { await api.spaceDeleteRoom(row, col, room().slug); await reload(true); roomIdx = 0; enterBuild(true); } catch (err) { toast(err.message); }
        });
        nav.append(del);
      }
    }
  }

  // ---------------------------------------------------------------- loading
  let me = null;
  function header() {
    const kind = space.kind ? KINDS[space.kind].label + " Square" : "Square";
    $("eyebrow").innerHTML = `<a href="/sfere#${grid.hash(row, col)}">← ${grid.label(row, col)}</a> · ${esc(kind)}`;
    $("title").textContent = space.title || (space.is_owner ? "Your Space" : `@${space.handle}'s Space`);
    $("sub").textContent = `${space.is_owner ? "Yours" : "@" + space.handle}${space.agent_name ? " · home of " + space.agent_name : ""} · ${fmt.format(space.visits || 0)} visit${space.visits === 1 ? "" : "s"}`;
    document.title = `${space.title || grid.label(row, col)} · QÜBE`;
  }
  function showEmpty() {
    const r = room();
    const empty = !layout.blocks.length && !builtins().length && !space.agent_name;
    $("empty").hidden = !empty || building;
    $("empty").textContent = space.is_owner ? (r && !r.published && r.draft && r.draft.blocks.length ? "This room is still a draft. Publish it to open it." : "An empty Space. Tap Build to make it yours.") : `@${space.handle} hasn't built here yet.`;
  }
  async function reload(keepRoom) {
    const v = await api.spaceView(row, col).catch(() => null);
    if (!v) return false;
    const slug = keepRoom && room() ? room().slug : null;
    space = v;
    if (!space.rooms.length && space.is_owner) space.rooms = [{ slug: "main", name: "Entrance", draft: { v: 1, blocks: [] }, published: null }];
    if (!space.rooms.length) space.rooms = [{ slug: "main", name: "Entrance", published: { v: 1, blocks: [] } }];
    const i = space.rooms.findIndex((r) => r.slug === (slug || startRoom));
    roomIdx = i >= 0 ? i : 0;
    header();
    $("build-btn").hidden = !space.is_owner || building;
    if (!building) {
      layout = { v: 1, blocks: JSON.parse(JSON.stringify((room().published || { blocks: [] }).blocks || [])).map((b) => ({ id: uid(), ...b })) };
    }
    renderRooms(); showEmpty();
    if (building) refreshCost();
    return true;
  }

  // Where a spot on the floor is on screen, for scripts and tests.
  window.QUBE.spaceAt = (x, y, z = 0) => Pc(x + 0.5, y + 0.5, z);

  (async () => {
    const signedIn = await api.hasSession().catch(() => false);
    me = signedIn ? await api.wallet().catch(() => null) : null;
    const ok = await reload();
    if (!ok) {
      $("title").textContent = "Open land";
      $("sub").textContent = "Nobody owns this Square yet.";
      $("eyebrow").innerHTML = `<a href="/sfere#${grid.hash(row, col)}">← ${grid.label(row, col)}</a>`;
      return;
    }
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
